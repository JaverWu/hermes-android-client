<!doctype html>
<html lang="zh">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Hermes 斜杠命令面板 · Demo</title>
  <!-- 零依赖：仅引入 Vue 3 全局构建；直接双击打开即可（需联网取 CDN） -->
  <script src="https://unpkg.com/vue@3/dist/vue.global.prod.js"></script>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; background: #f5f6f8; }
    #app { max-width: 480px; margin: 48px auto; padding: 0 16px; }
    .chat-title { font-weight: 700; font-size: 18px; margin-bottom: 12px; }
    .input-wrap { position: relative; }
    .chat-input {
      width: 100%; border: 1px solid #e6e8eb; border-radius: 14px; padding: 12px;
      font: 15px/1.5 system-ui, sans-serif; resize: vertical; background: #fff;
    }
    .hint { margin-top: 12px; font-size: 12px; color: #8a8f98; line-height: 1.6; }
    .hint code { background: #f0f2f5; border-radius: 4px; padding: 1px 5px; font-size: 11px; }

    /* 面板样式（与 SlashCommandPanel.vue 一致） */
    .slash-panel {
      position: absolute; left: 0; right: 0; bottom: calc(100% + 8px);
      max-height: 320px; overflow-y: auto; background: #fff; color: #1c1c1e;
      border: 1px solid #e6e8eb; border-radius: 14px; box-shadow: 0 8px 30px rgba(0,0,0,.12);
      padding: 6px; z-index: 50; font: 14px/1.4 system-ui, sans-serif;
    }
    .slash-group + .slash-group { margin-top: 4px; }
    .slash-group-title { font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: .04em; color: #8a8f98; padding: 6px 10px 2px; }
    .slash-item { display: flex; align-items: center; gap: 10px; width: 100%; text-align: left; background: transparent; border: 0; border-radius: 10px; padding: 8px 10px; cursor: pointer; color: inherit; }
    .slash-item.active { background: #3390ec; color: #fff; }
    .slash-item.active .slash-desc { color: rgba(255,255,255,.85); }
    .slash-icon { font-size: 18px; line-height: 1; flex: none; }
    .slash-text { display: flex; flex-direction: column; min-width: 0; }
    .slash-title { font-weight: 600; }
    .slash-desc { font-size: 12px; color: #8a8f98; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    @media (prefers-color-scheme: dark) {
      body { background: #000; }
      .chat-input { background: #1c1c1e; color: #f2f2f7; border-color: #3a3a3c; }
      .hint code { background: #2c2c2e; }
      .slash-panel { background: #1c1c1e; color: #f2f2f7; border-color: #3a3a3c; }
      .slash-group-title { color: #8e8e93; }
      .slash-desc { color: #8e8e93; }
    }
  </style>
</head>
<body>
  <div id="app">
    <div class="chat-title">Hermes 对话</div>
    <div class="input-wrap">
      <!-- 浮层 -->
      <div v-if="open" class="slash-panel" role="listbox">
        <div v-for="grp in grouped" :key="grp.label" class="slash-group">
          <div class="slash-group-title">{{ grp.label }}</div>
          <button
            v-for="(item, i) in grp.items"
            :key="item.id"
            type="button"
            class="slash-item"
            :class="{ active: flatIndex(item.id) === activeIndex }"
            role="option"
            @mouseenter="activeIndex = flatIndex(item.id)"
            @click="applySelect(item)"
          >
            <span class="slash-icon">{{ item.icon }}</span>
            <span class="slash-text">
              <span class="slash-title">{{ item.title }}</span>
              <span class="slash-desc">{{ item.description }}</span>
            </span>
          </button>
        </div>
      </div>
      <textarea
        ref="ta"
        class="chat-input"
        rows="3"
        placeholder="输入 / 唤起命令…（试试 /eng、/web）"
        @input="onInput"
        @keydown="onKeydown"
        @keyup="onKeyup"
      ></textarea>
    </div>
    <p class="hint">
      输入 <code>/</code> 弹面板；<code>/</code> 后跟字符实时过滤；
      <code>↑ ↓</code> 移动、<code>Enter</code>/<code>Tab</code> 选中、<code>Esc</code> 关闭、回删到 <code>/</code> 自动收起。
    </p>
  </div>

  <script>
    const { createApp, ref, computed, onMounted } = Vue;

    // ---- 数据源（同 commands.js 的静态部分）----
    const COMMANDS = [
      { group: 'skill', groupLabel: 'Skills', title: 'english-frame', description: '把任意内容改写成地道英文', icon: '🌐', token: '/skill:english-frame' },
      { group: 'skill', groupLabel: 'Skills', title: 'code-review', description: '对代码做结构化审查并给建议', icon: '🧪', token: '/skill:code-review' },
      { group: 'skill', groupLabel: 'Skills', title: 'summarize', description: '长文本摘要与要点提取', icon: '📝', token: '/skill:summarize' },
      { group: 'tool', groupLabel: '工具 / 能力', title: 'Web 搜索', description: '联网检索网页与实时信息', icon: '🔍', token: '/tool:web' },
      { group: 'tool', groupLabel: '工具 / 能力', title: '终端', description: '在沙箱中执行 shell 命令', icon: '💻', token: '/tool:terminal' },
      { group: 'tool', groupLabel: '工具 / 能力', title: '文件读写', description: '读取与写入工作区文件', icon: '📄', token: '/tool:file' },
      { group: 'tool', groupLabel: '工具 / 能力', title: '画图', description: '生成或编辑图片', icon: '🎨', token: '/tool:draw' },
      { group: 'tool', groupLabel: '工具 / 能力', title: '定时任务', description: '创建周期性定时任务', icon: '⏰', token: '/tool:cron' },
      { group: 'command', groupLabel: '内置命令', title: '创建定时任务', description: '用自然语言新建一个定时任务', icon: '⏰', token: '/command:create-cron' },
      { group: 'command', groupLabel: '内置命令', title: '保存记忆', description: '把当前内容存入长期记忆', icon: '🧠', token: '/command:save-memory' },
      { group: 'command', groupLabel: '内置命令', title: '调用 Skill', description: '手动触发某个已安装 skill', icon: '🚀', token: '/command:run-skill' },
      { group: 'command', groupLabel: '内置命令', title: '清空对话', description: '清掉当前会话的全部消息', icon: '🗑️', action: () => alert('清空对话') },
      { group: 'template', groupLabel: '提示词模板', title: '会议纪要', description: '把对话整理成会议纪要模板', icon: '🗒️', token: '/tpl:meeting' },
      { group: 'template', groupLabel: '提示词模板', title: '邮件草稿', description: '按要点生成一封邮件', icon: '✉️', token: '/tpl:email' },
    ];

    createApp({
      setup() {
        const open = ref(false);
        const query = ref('');
        const activeIndex = ref(0);
        const ta = ref(null);
        let triggerPos = -1;

        const filtered = computed(() => {
          const q = query.value.trim().toLowerCase();
          if (!q) return COMMANDS;
          return COMMANDS.filter((c) =>
            [c.title, c.description].join(' ').toLowerCase().includes(q)
          );
        });
        const grouped = computed(() => {
          const map = new Map();
          for (const c of filtered.value) {
            if (!map.has(c.groupLabel)) map.set(c.groupLabel, []);
            map.get(c.groupLabel).push(c);
          }
          return [...map.entries()].map(([label, items]) => ({ label, items }));
        });
        const flat = computed(() => grouped.value.flatMap((g) => g.items));
        function flatIndex(id) { return flat.value.findIndex((c) => c.id === id); }

        function handleInput(value, caret) {
          const before = value.slice(0, caret);
          const slashIdx = before.lastIndexOf('/');
          const ok =
            slashIdx !== -1 &&
            (slashIdx === 0 || /\s/.test(before[slashIdx - 1])) &&
            !before.slice(slashIdx + 1).includes(' ');
          if (ok) {
            triggerPos = slashIdx;
            query.value = before.slice(slashIdx + 1);
            activeIndex.value = 0;
            open.value = true;
          } else {
            open.value = false;
            triggerPos = -1;
          }
        }
        function move(delta) {
          const len = filtered.value.length;
          if (!len) return;
          activeIndex.value = (activeIndex.value + delta + len) % len;
        }
        function close() { open.value = false; query.value = ''; triggerPos = -1; }
        function select(item) {
          if (!item) return null;
          if (item.action) { item.action(); close(); return null; }
          const token = item.token || '/' + item.title;
          const res = { token, triggerPos, replaceLen: query.value.length + 1 };
          close();
          return res;
        }

        function onInput(e) { handleInput(e.target.value, e.target.selectionStart); }
        function onKeyup() { if (ta.value) handleInput(ta.value.value, ta.value.selectionStart); }
        function onKeydown(e) {
          if (!open.value) return;
          if (e.key === 'ArrowDown') { e.preventDefault(); move(1); }
          else if (e.key === 'ArrowUp') { e.preventDefault(); move(-1); }
          else if (e.key === 'Escape') { e.preventDefault(); close(); }
          else if (e.key === 'Enter' || e.key === 'Tab') {
            e.preventDefault();
            applySelect(filtered.value[activeIndex.value]);
          }
          // 删到 "/" 之前自动收起
          if (e.key === 'Backspace' && query.value === '') close();
        }
        function applySelect(item) {
          const res = select(item);
          if (!res || !res.token) return;
          const el = ta.value;
          const v = el.value;
          el.value = v.slice(0, res.triggerPos) + res.token + ' ' + v.slice(res.triggerPos + res.replaceLen);
          const pos = res.triggerPos + res.token.length + 1;
          el.focus();
          el.setSelectionRange(pos, pos);
          el.dispatchEvent(new Event('input'));
        }

        onMounted(() => { /* 真实项目里这里换成 fetchCommands() 拉后端 */ });
        return { open, grouped, activeIndex, ta, flatIndex, onInput, onKeyup, onKeydown, applySelect };
      },
    }).mount('#app');
  </script>
</body>
</html>
